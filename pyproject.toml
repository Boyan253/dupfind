[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dupfind"
version = "0.1.0"
description = "Find duplicate files by content hash, cheaply: size first, then a partial hash, then a full one."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/Boyan253/dupfind"

[project.scripts]
dupfind = "dupfind:main"

[tool.setuptools]
py-modules = ["dupfind"]
